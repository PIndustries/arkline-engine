[package]
name = "arkline-client"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
arkline-protocol.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
eframe = "0.31"
glam = "=0.29.3"
web-time = "=1.1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arkline-verifier = { path = "../verifier" }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "1"
cpal = "=0.15.3"
tungstenite = { version = "=0.28.0", features = ["rustls-tls-webpki-roots"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { version = "=0.15.3", features = ["wasm-bindgen"] }
send_wrapper = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Storage", "WebSocket", "MessageEvent", "CloseEvent", "ErrorEvent", "Location"] }
