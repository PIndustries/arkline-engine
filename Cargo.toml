[workspace]
members = ["crates/arkline-protocol", "apps/server", "apps/client", "apps/verifier", "apps/cli", "apps/asset-tool", "apps/editor"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"

[workspace.dependencies]
arkline-protocol = { path = "crates/arkline-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
