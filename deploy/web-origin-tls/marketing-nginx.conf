worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
  access_log /dev/stdout;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  # Fixed paths: user-controlled SNI never selects a filesystem location.
  # Variable filenames with cache disabled reload renewed credentials per handshake.
  map $ssl_server_name $arkline_tls_cert { default /run/arkline-tls/tls.crt; }
  map $ssl_server_name $arkline_tls_key { default /run/arkline-tls/tls.key; }
  ssl_certificate $arkline_tls_cert;
  ssl_certificate_key $arkline_tls_key;
  ssl_certificate_cache off;
  ssl_protocols TLSv1.2 TLSv1.3;
  server {
    listen 8443 ssl;
    server_name arkline.network www.arkline.network;
    client_max_body_size 20m;
    location / {
      proxy_pass http://127.0.0.1:4000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Port 443;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 65s;
    }
  }
}
