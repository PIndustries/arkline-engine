worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  map $ssl_server_name $arkline_tls_cert { default /run/arkline-tls/tls.crt; }
  map $ssl_server_name $arkline_tls_key { default /run/arkline-tls/tls.key; }
  ssl_certificate $arkline_tls_cert;
  ssl_certificate_key $arkline_tls_key;
  ssl_certificate_cache off;
  ssl_protocols TLSv1.2 TLSv1.3;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  keepalive_timeout 65;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  gzip on;
  gzip_types application/wasm application/javascript text/css application/json;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  server {
    listen 8080 default_server;
    listen 8443 ssl default_server;
    server_name _;
    location = /health { access_log off; return 200 'ready\n'; }
    location / { return 404; }
  }
  server {
    listen 8080;
    listen 8443 ssl;
    server_name arkline.network www.arkline.network;
    location / { return 302 https://p.industries/arkline; }
  }
  server {
    listen 8080;
    listen 8443 ssl;
    server_name play.arkline.network;
    root /srv/web;
    include /etc/nginx/arkline-release.conf;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss:; media-src 'self' blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    add_header Cache-Control no-cache;
    location / { try_files $uri $uri/ =404; }
  }
  server {
    listen 8080;
    listen 8443 ssl;
    server_name downloads.arkline.network;
    root /srv/downloads;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control 'public, max-age=3600';
    location / { try_files $uri =404; }
  }
}
