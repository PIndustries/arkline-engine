apiVersion: v1
kind: Service
metadata: {name: arkline-web-tls, namespace: arkline}
spec:
  selector: {app: arkline-web}
  ports: [{name: https, port: 8443, targetPort: origin-https}]
---
apiVersion: v1
kind: Service
metadata: {name: arkline-marketing-tls, namespace: bastion}
spec:
  selector: {app: bastion}
  ports: [{name: https, port: 8443, targetPort: origin-https}]
