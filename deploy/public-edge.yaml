# Apply after building and validating the web/download image. No credentials in Git.
# Existing private-validation-only deny policy stays; these add narrow allowances.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arkline-tunnel
  namespace: arkline
spec:
  replicas: 2
  selector:
    matchLabels: {app: arkline-tunnel}
  template:
    metadata:
      labels: {app: arkline-tunnel}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2025.8.1
          args: [tunnel, --no-autoupdate, --metrics, '0.0.0.0:2000', --protocol, http2, run]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef: {name: arkline-tunnel, key: token}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports: [{name: metrics, containerPort: 2000}]
          readinessProbe:
            httpGet: {path: /ready, port: metrics}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: '1', memory: 256Mi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: tunnel-egress, namespace: arkline}
spec:
  podSelector:
    matchLabels: {app: arkline-tunnel}
  policyTypes: [Egress]
  egress:
    - ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - ports: [{protocol: TCP, port: 7844}, {protocol: TCP, port: 443}]
    - to: [{podSelector: {}}]
      ports: [{protocol: TCP, port: 7778}, {protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: public-origins-from-tunnel, namespace: arkline}
spec:
  podSelector:
    matchLabels: {arkline-public-origin: 'true'}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: arkline-tunnel}
      ports: [{protocol: TCP, port: 7778}, {protocol: TCP, port: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: arkline-web, namespace: arkline}
spec:
  selector: {app: arkline-web}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: arkline-web, namespace: arkline}
spec:
  replicas: 2
  selector:
    matchLabels: {app: arkline-web}
  template:
    metadata:
      labels: {app: arkline-web, arkline-public-origin: 'true'}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: arkline-web:REPLACE_WITH_IMMUTABLE_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: '1', memory: 256Mi}
          volumeMounts: [{name: temporary, mountPath: /tmp}]
      volumes: [{name: temporary, emptyDir: {sizeLimit: 64Mi}}]
