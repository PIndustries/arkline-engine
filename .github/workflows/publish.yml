name: Publish verified release
on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful main release.yml run containing all three platforms and browser
        type: string
        required: true
      version:
        description: Exact BUILD_VERSION from that run (new versions only)
        type: string
        required: true
      upgrade_servers:
        description: Also upgrade production/test servers after web verification
        type: boolean
        default: false
      backup_reference:
        description: Verified operator backup reference (required only for server upgrades)
        type: string
        required: false
permissions:
  contents: write
  actions: read
  packages: write
concurrency:
  group: arkline-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, phx, fleet, org]
    timeout-minutes: 120
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate publisher helpers
        run: python3 tools/ci/test_publish_release.py
      - name: Publish matching, verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_CONFIG: ${{ secrets.ARKLINE_DEPLOY_KUBECONFIG }}
          RELEASE_RUN: ${{ inputs.release_run_id }}
          RELEASE_VERSION: ${{ inputs.version }}
          UPGRADE_SERVERS: ${{ inputs.upgrade_servers }}
          BACKUP_REFERENCE: ${{ inputs.backup_reference }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_CONFIG" || { echo 'Scoped deployment credential is missing'; exit 1; }
          export KUBECONFIG="$RUNNER_TEMP/arkline-publish-$GITHUB_RUN_ID.kubeconfig"
          export DOCKER_CONFIG="$RUNNER_TEMP/arkline-publish-$GITHUB_RUN_ID.docker"
          umask 077
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$DEPLOY_CONFIG" > "$KUBECONFIG"
          unset DEPLOY_CONFIG
          trap 'rm -f "$KUBECONFIG"; rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          args=(--run-id "$RELEASE_RUN" --version "$RELEASE_VERSION" --output "$RUNNER_TEMP/arkline-publish-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --apply)
          if [[ "$UPGRADE_SERVERS" == true ]]; then
            args+=(--upgrade-servers --backup-reference "$BACKUP_REFERENCE")
          fi
          python3 tools/ci/publish-release.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arkline-publication-plan
          path: ${{ runner.temp }}/arkline-publish-${{ github.run_id }}-${{ github.run_attempt }}/publication-plan.json
          if-no-files-found: ignore
          retention-days: 30
