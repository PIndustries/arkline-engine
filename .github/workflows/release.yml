name: Prepare release downloads
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform download sets to prepare
        required: true
        default: all
        type: choice
        options: [all, windows, linux, macos]
permissions:
  contents: read
concurrency:
  group: arkline-release-build
  cancel-in-progress: false
jobs:
  package:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            labels: '["self-hosted","Linux","X64","phx","fleet","org"]'
          - platform: windows
            labels: '["self-hosted","Linux","X64","phx","fleet","org"]'
          - platform: macos
            labels: '["self-hosted","macOS","ARM64","arkline"]'
    runs-on: ${{ fromJSON(matrix.labels) }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
        with:
          persist-credentials: false
      - name: Prepare selected platform
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
        env:
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/arkline-downloads-$GITHUB_RUN_ID-$PLATFORM"
          case "$PLATFORM" in
            linux)
              bash tools/ci/linux.sh build-image
              bash tools/ci/linux.sh test
              bash tools/ci/linux.sh package "$destination" ;;
            windows)
              bash tools/ci/windows-cross.sh build-image
              bash tools/ci/windows-cross.sh test
              bash tools/ci/windows-cross.sh package "$destination" ;;
            macos)
              cargo test --workspace --locked
              python3 tools/test_package_release.py
              python3 tools/package-release.py "$destination" ;;
          esac
          echo "DOWNLOADS=$destination" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
        with:
          name: arkline-downloads-${{ matrix.platform }}
          path: ${{ env.DOWNLOADS }}/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
  browser:
    if: github.ref == 'refs/heads/main' && inputs.platform == 'all'
    runs-on: [self-hosted, Linux, X64, phx, fleet, org]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fleet Rust toolchain
        run: echo '/opt/gha-org-runner/.cargo/bin' >> "$GITHUB_PATH"
      - run: bash apps/client/web/build.sh "$RUNNER_TEMP/arkline-browser-$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: arkline-browser
          path: ${{ runner.temp }}/arkline-browser-${{ github.run_id }}/*
          if-no-files-found: error
          retention-days: 30
