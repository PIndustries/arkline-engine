name: Validate Arkline
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arkline-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, phx, fleet, org]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash tools/ci/linux.sh build-image
      - run: bash tools/ci/linux.sh test
  macos:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, arkline]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: python3 tools/test_package_release.py
      - name: Compile native speech bridge
        run: swiftc -target "$(uname -m)-apple-macos14.0" -swift-version 5 -warnings-as-errors tools/arkline-speech.swift -o "$RUNNER_TEMP/arkline-speech"
  browser:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, phx, fleet, org]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fleet Rust toolchain
        run: echo '/opt/gha-org-runner/.cargo/bin' >> "$GITHUB_PATH"
      - run: cargo clippy --locked -p arkline-client --target wasm32-unknown-unknown -- -D warnings
