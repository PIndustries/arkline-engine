<text x="40" y="1240" class="small">Yellow: normal power. Orange: essential power. Blue: data/RF/sensors. Pink: suppression provisions.</text>
<text x="40" y="1268" class="small">Green/purple: supply/return air. Door panel: local manual release; network failure must not trap players.</text>
<text x="40" y="1296" class="small">Suppression supply is separate from potable water. Agent, coverage and activation logic are UNRESOLVED.</text>
<text x="40" y="1324" class="small">Sensors and alarm endpoints are explicit proposals; no live simulation or physical calibration is claimed.</text>
<text x="40" y="1352" class="small">Coordinate validation proves points fit room bounds only. Equipment size, bend space and collisions remain open.</text>
<text x="40" y="1380" class="small">Use per-ship JSON for branch isolators and exact XYZ values. Printed/resized drawing is not literal 1:1 scale.</text>
